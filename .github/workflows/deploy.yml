name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: workers-production
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakulab/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Build packages
        run: nix develop -c pnpm run build:packages

      - name: Deploy
        uses: hakulab/devkit/.github/actions/workers@v3
        with:
          directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
